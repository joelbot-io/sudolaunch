name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (restore prebuilt native binaries)
        run: |
          npm ci --ignore-scripts
          node ./scripts/postinstall.js

      - name: Run TypeScript typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Compile C# Win32 Helpers (if csc.exe available)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            New-Item -ItemType Directory -Force -Path resources\bin | Out-Null
            & $csc /target:winexe /out:resources\bin\sendkey.exe /optimize+ src\main\tools\sendkey.cs
            & $csc /target:exe /out:resources\bin\swaphook.exe /optimize+ src\main\tools\swaphook.cs
          }

      - name: Build & Package Windows Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/v*") {
            npm run release:win
          } else {
            npm run build:win
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudoLaunch-Windows-Installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

